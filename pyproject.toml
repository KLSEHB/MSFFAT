[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msffat"
version = "0.1.0"
description = "Clean MSFFAT implementation for website fingerprinting experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "tensorflow",
  "scikit-learn",
]

[tool.setuptools]
packages = ["msffat"]

[project.optional-dependencies]
benchmarks = ["torch"]
